<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>Toolkit</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html{height:100%;overflow:hidden;overscroll-behavior:none;}
  body{height:var(--app-height, 100%);overflow:hidden;overscroll-behavior:none;display:flex;flex-direction:column;font-family:'DM Mono','Courier New',monospace;background:#0d0f14;}

  .shell-bar{
    flex-shrink:0;background:#15171f;color:#f0e8d8;
    display:flex;align-items:center;gap:.6rem;
    padding:.5rem .7rem;
    border-bottom:1px solid #2a2d3a;
    -webkit-user-select:none;user-select:none;
  }
  .win-btn{
    background:#20232f;border:1px solid #33374a;color:#c9c2b0;
    width:2.1rem;height:2.1rem;border-radius:.6rem;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;font-size:1rem;flex-shrink:0;transition:.15s;
  }
  .win-btn:hover{background:#2c3040;}
  .win-btn.active-toggle{color:#f0e030;border-color:#f0e030;}
  .shell-title{font-weight:600;font-size:.75rem;letter-spacing:.05em;opacity:.85;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .shell-title b{color:#f0e030;font-weight:600;}

  .win-menu{
    position:fixed;top:3.1rem;left:.7rem;z-index:500;
    background:#181a24;border:1px solid #33374a;border-radius:.9rem;
    box-shadow:0 18px 40px rgba(0,0,0,.5);
    min-width:230px;padding:.4rem;
    display:none;flex-direction:column;gap:.25rem;
  }
  .win-menu.open{display:flex;}
  .win-opt{
    display:flex;align-items:center;gap:.6rem;
    padding:.55rem .65rem;border-radius:.6rem;cursor:pointer;
    color:#d8d2c2;font-size:.75rem;transition:.12s;
    border:1px solid transparent;
  }
  .win-opt:hover{background:#232636;}
  .win-opt.current{background:#2a2f1a;border-color:#f0e03055;color:#f0e030;}
  .win-opt .ico{
    width:1.8rem;height:1.8rem;border-radius:.5rem;
    display:flex;align-items:center;justify-content:center;
    font-size:.9rem;flex-shrink:0;background:#2c2e38;
  }
  .win-opt .lbl{display:flex;flex-direction:column;gap:.05rem;min-width:0;}
  .win-opt .lbl .t{font-weight:600;line-height:1.2;}
  .win-opt .lbl .s{font-size:.6rem;opacity:.55;font-weight:400;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .win-menu-backdrop{position:fixed;inset:0;z-index:400;display:none;}
  .win-menu-backdrop.open{display:block;}

  .win-stage{flex:1;min-height:0;position:relative;overflow:hidden;background:#0d0f14;}
  .win-frame-wrap{position:absolute;inset:0;display:none;}
  .win-frame-wrap.active{display:block;}
  .win-frame-wrap iframe{width:100%;height:100%;border:0;display:block;background:#fff;}

  .win-loading{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:#665f4c;font-size:.7rem;letter-spacing:.08em;background:#0d0f14;
  }
</style>
</head>
<body>

<div class="shell-bar">
  <button class="win-btn" id="menuToggle" title="Switch window">&#9776;</button>
  <div class="shell-title">TOOLKIT &middot; <b id="curWinName">Classic Reminder</b></div>
</div>

<div class="win-menu-backdrop" id="menuBackdrop"></div>
<div class="win-menu" id="winMenu">
  <div class="win-opt current" data-win="reminder">
    <div class="ico">&#128276;</div>
    <div class="lbl"><span class="t">Classic Reminder</span><span class="s">Positional date/time reminder parser</span></div>
  </div>
  <div class="win-opt" data-win="ocr">
    <div class="ico">&#9993;</div>
    <div class="lbl"><span class="t">OCR Workshop</span><span class="s">Clean, cut &amp; fix scanned/OCR text</span></div>
  </div>
</div>

<div class="win-stage" id="winStage">
  <div class="win-frame-wrap active" id="wrap-reminder">
    <div class="win-loading">loading reminder…</div>
  </div>
  <div class="win-frame-wrap" id="wrap-ocr">
    <div class="win-loading">loading OCR workshop…</div>
  </div>
</div>

<script>
  // ---- keep the shell's own height tied to the real visible viewport too ----
  function setShellHeight() {
    const h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    document.documentElement.style.setProperty('--app-height', h + 'px');
  }
  setShellHeight();
  window.addEventListener('resize', setShellHeight);
  window.addEventListener('orientationchange', setShellHeight);
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', setShellHeight);
  }

  // ---- decode base64 (UTF-8 safe) into HTML strings, then load into iframes via srcdoc ----
  function b64ToUtf8(b64) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }

  const WINDOWS = {
    reminder: { name: 'Classic Reminder', b64Id: 'reminderB64' },
    ocr:      { name: 'OCR Workshop',      b64Id: 'ocrB64' }
  };

  function mountWindow(key) {
    const wrap = document.getElementById('wrap-' + key);
    if (wrap.dataset.mounted) return;
    const html = b64ToUtf8(document.getElementById(WINDOWS[key].b64Id).textContent.trim());
    const iframe = document.createElement('iframe');
    iframe.setAttribute('sandbox', 'allow-scripts allow-forms allow-popups allow-modals allow-downloads allow-same-origin');
    iframe.srcdoc = html;
    wrap.innerHTML = '';
    wrap.appendChild(iframe);
    wrap.dataset.mounted = '1';
  }

  let currentWin = 'reminder';
  function showWindow(key) {
    if (!WINDOWS[key]) return;
    mountWindow(key);
    document.querySelectorAll('.win-frame-wrap').forEach(w => w.classList.remove('active'));
    document.getElementById('wrap-' + key).classList.add('active');
    document.querySelectorAll('.win-opt').forEach(o => o.classList.toggle('current', o.dataset.win === key));
    document.getElementById('curWinName').textContent = WINDOWS[key].name;
    currentWin = key;
    closeMenu();
  }

  const menu = document.getElementById('winMenu');
  const backdrop = document.getElementById('menuBackdrop');
  const menuToggle = document.getElementById('menuToggle');
  function openMenu() { menu.classList.add('open'); backdrop.classList.add('open'); menuToggle.classList.add('active-toggle'); }
  function closeMenu() { menu.classList.remove('open'); backdrop.classList.remove('open'); menuToggle.classList.remove('active-toggle'); }
  menuToggle.addEventListener('click', () => { menu.classList.contains('open') ? closeMenu() : openMenu(); });
  backdrop.addEventListener('click', closeMenu);
  document.querySelectorAll('.win-opt').forEach(o => o.addEventListener('click', () => showWindow(o.dataset.win)));

  // Let the embedded pages' own "switch" header buttons drive the shell too,
  // instead of trying to navigate to a URL that doesn't exist inside srcdoc.
  window.addEventListener('message', (e) => {
    if (e.data && e.data.type === 'switchWindow' && WINDOWS[e.data.win]) {
      showWindow(e.data.win);
    }
  });

  // mount default window (Classic Reminder) on load
  mountWindow('reminder');
</script>
